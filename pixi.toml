[workspace]
name = "learn-cpp-bench"
version = "0.1.0"
description = "Benchmarks and plotting utilities for Learn-Cpp project"
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64"]

[dependencies]
python = ">=3.11,<3.13"
matplotlib = "*"

[tasks]
plot-working-set = "python topics/microarchitecture/working_set_plot.py"
bench = "python tools/run_cpp_benchmarks.py"
bench-quick = "python tools/run_cpp_benchmarks.py --only thread_safe_queue false_sharing aos_vs_soa_particles hot_loop_optimization"

